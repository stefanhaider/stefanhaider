# Beispiel-Pipeline im Repository des Data Managers (Pfade relativ zu data_manager/ bzw. eurer Struktur).
# PR/Release: Tests (inkl. PostgreSQL), Export der Status-Maschine, Prüfung gegen das Soll-Modell.
# Deploy: zusätzlich dm-sync-governance gegen die Ziel-Datenbank (eigener Job, eigene Credentials).
name: workflow-conformance
on:
  pull_request:
  push:
    tags: ["v*"]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:                            # für python/tests/test_postgres.py
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: dm_test, POSTGRES_INITDB_ARGS: "--encoding=UTF8" }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DM_TEST_PG_DSN: postgresql://postgres:test@localhost:5432/dm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./python[test]
      - name: Tests (Status-Maschine, Export, Check, PostgreSQL, Sync)
        run: pytest python/tests -q
      - name: Status-Maschine exportieren
        run: mkdir -p build && dm-export-workflow --out build/workflow_definition.json
      - name: Gegen Soll-Modell prüfen (governance/ ist per CODEOWNERS der Governance zugeordnet)
        run: |
          dm-check-workflow \
            --model governance/governance_model.json \
            --workflow build/workflow_definition.json \
            --accepted governance/accepted_deviations.json \
            --fail-on kritisch --json build/workflow_conformance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-conformance
          path: build/
