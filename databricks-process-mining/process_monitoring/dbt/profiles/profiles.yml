# local:      lokales Apache Spark (session) mit Delta – für Entwicklung und Abnahmetests (tools/run_dbt_local.sh)
# databricks: Databricks SQL Warehouse. Im Databricks-Job (dbt_task) werden Host/Token als Umgebungsvariablen
#             bereitgestellt; Katalog/Schema kommen aus der Bundle-Konfiguration (../databricks.yml).
#             Abgleichen mit der Vorlage von `databricks bundle init dbt-sql`.
process_monitoring:
  target: local
  outputs:
    local:
      type: spark
      method: session
      host: NA
      schema: process_monitoring
    databricks:
      type: databricks
      host: "{{ env_var('DBT_HOST') }}"
      http_path: "{{ env_var('DBT_HTTP_PATH', '') }}"
      token: "{{ env_var('DBT_ACCESS_TOKEN') }}"
      catalog: "{{ env_var('DBT_CATALOG', 'main') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'process_monitoring') }}"
      threads: 4
