# Beispiel: Workflow-Konformität bei jedem Pull Request / Release des Data Managers prüfen.
# Voraussetzung: das Paket datamanager_governance (Ordner python/) ist Teil des Data-Manager-Repos
# bzw. als Abhängigkeit installiert; das Soll-Modell kommt aus dem Governance-Repository.
name: workflow-conformance
on:
  pull_request:
  push:
    tags: ["v*"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4          # Soll-Modell der Governance (eigenes Repo, eigene Freigaben)
        with:
          repository: your-org/data-governance-model
          path: governance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./python[test]
      - name: Tests (Status-Maschine, Export, Check)
        run: pytest python/tests -q
      - name: Status-Maschine exportieren
        run: mkdir -p build && dm-export-workflow --out build/workflow_definition.json
      - name: Gegen Soll-Prozess prüfen
        run: |
          dm-check-workflow \
            --model governance/governance_model.json \
            --workflow build/workflow_definition.json \
            --accepted governance/accepted_deviations.json \
            --fail-on kritisch --json build/workflow_conformance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-conformance
          path: build/
