[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamanager-governance"
version = "0.1.0"
description = "Prozess-Events, Status-Maschine und Konformitäts-Check für den Data Manager"
requires-python = ">=3.10"
dependencies = []          # Kern nur mit Standardbibliothek

[project.optional-dependencies]
databricks = ["databricks-sdk>=0.30"]   # Publisher in ein Unity-Catalog-Volume
test = ["pytest>=8"]

[project.scripts]
dm-export-workflow = "datamanager_governance.export:main"
dm-check-workflow = "datamanager_governance.conformance:main"
dm-publish-events = "datamanager_governance.publisher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
